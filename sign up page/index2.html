<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up Page</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrapper">
    <form action="">
      <h1 class="h1">Signup</h1>
       
      <div class="inputbox">
        <input type="text" placeholder="Enter your username" required>
      </div>

      <div class="inputbox">
        <input type="email" placeholder="Enter your email" required>
      </div>
      
      <div class="inputbox">
        <input type="password" placeholder="Enter your password" required minlength="10" maxlength="15">
        
      </div>
      <div class="remember">
        <label><input type="checkbox"> Remember Me</label>
        <a href="">Foget password</a>
      </div>
      <div class="btn">
        <button type="submit">Signup</button>
      </div>
      <div class="register">
        <p>Have an account Login</p><a href="index.html">Login</a>
      </div>

    </form>
  </div>
</body>
</html>
